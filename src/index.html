<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>%TITLE%</title>
<meta name="description" content="%DESC%">
<link rel="icon" href="icons/%ICON%.svg" type="image/svg+xml">
<script>try{const t=localStorage.getItem("hubTheme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: drafting-table study hub. Sidebar index of topics on desktop, scrollable tab strip on phone; content column ~74ch. */
:root{
  --bg:#f5f6f3; --panel:#ffffff; --ink:#15211f; --ink-2:#4a5754; --ink-3:#7b8784;
  --line:#dde2de; --line-2:#c9d1cc; --grid:rgba(21,33,31,.045);
  --accent:#a3195b; --accent-ink:#ffffff; --accent-soft:#f8e6ee;
  --amber:#a8650a; --amber-soft:#fbefd9; --red:#b3362f; --red-soft:#f8e4e1; --green:#1f7a3a; --green-soft:#e2f2e6;
  --violet:#5a47b5; --violet-soft:#ebe8f8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --f-display:"Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif;
  --f-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --panel:#18211f; --ink:#e7eeeb; --ink-2:#aebbb7; --ink-3:#7f8d89;
  --line:#26322f; --line-2:#34423e; --grid:rgba(231,238,235,.04);
  --accent:#f07aae; --accent-ink:#1a0b12; --accent-soft:#3a1828;
  --amber:#e0a23c; --amber-soft:#33270f; --red:#ec7b72; --red-soft:#3a1d1a; --green:#62c47f; --green-soft:#16301f;
  --violet:#a497f0; --violet-soft:#25213f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --panel:#18211f; --ink:#e7eeeb; --ink-2:#aebbb7; --ink-3:#7f8d89;
  --line:#26322f; --line-2:#34423e; --grid:rgba(231,238,235,.04);
  --accent:#f07aae; --accent-ink:#1a0b12; --accent-soft:#3a1828;
  --amber:#e0a23c; --amber-soft:#33270f; --red:#ec7b72; --red-soft:#3a1d1a; --green:#62c47f; --green-soft:#16301f;
  --violet:#a497f0; --violet-soft:#25213f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
/*ACCENT*/
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
a{color:var(--accent)}
code{font-family:var(--f-mono);font-size:.88em;background:var(--accent-soft);padding:.05em .35em;border-radius:4px}
.opt>span,.md li,.md p{min-width:0;overflow-wrap:anywhere}
#view :not(pre)>code{overflow-wrap:anywhere}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:-.01em}
.brand small{display:block;color:var(--ink-3);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:10px 8px 4px}
.nav a{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
.nav a img{width:22px;height:22px;flex:none}
.nav a .pc{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nav a:hover{background:var(--accent-soft)}
.nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav a[aria-current="page"] .pc{color:var(--accent-ink)}
.nav a[aria-current="page"] img,.mtabs a[aria-current="page"] img{background:#fff;border-radius:6px;padding:2px;box-sizing:border-box}
.tbtn{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:5px 9px;color:var(--ink-2);cursor:pointer;font-size:13px;white-space:nowrap}
.tbtn:hover{border-color:var(--accent);color:var(--ink)}
.tbtn svg{width:16px;height:16px;flex:none}
.side .tbtn{align-self:flex-start;margin:0 6px}
.mtabs .tbtn{flex:none;padding:6px 9px}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.res a{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-decoration:none;color:var(--ink);background:var(--bg);min-width:0}
.res a:hover{border-color:var(--accent)}
.res a b{font-weight:600}
.res a small{color:var(--ink-3)}
.res .kind{font:11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.side .foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:0 6px}
.main{min-width:0;padding-block:28px 80px;padding-inline:32px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.mtabs{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px}
  .mtabs a{flex:none;display:flex;gap:6px;align-items:center;padding:6px 10px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:13px}
  .mtabs a img{width:18px;height:18px}
  .mtabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .main{padding-inline:16px;padding-block:18px 60px}
}
.hero{display:flex;gap:16px;align-items:flex-start}
.hero img{width:56px;height:56px;flex:none;border-radius:12px}
.hero h1{font-size:clamp(26px,4vw,36px);font-weight:800;letter-spacing:-.02em}
@media (max-width:860px){.sbtn kbd{display:none}.hero{gap:12px}.hero img{width:40px;height:40px}}
.hero p{margin:6px 0 0;color:var(--ink-2);max-width:68ch}
.hero>div{min-width:0}.hero .chip{white-space:normal;border-radius:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);background:var(--panel);white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.chip{cursor:pointer}
.toc{display:flex;gap:6px;flex-wrap:wrap}
.toc a{font-size:13px;text-decoration:none;padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink-2)}
/* right-hand table of contents with scroll-spy; on narrow screens it falls back to the chip row */
.wrap.wide{max-width:1260px}
.tlay{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:28px;align-items:start}
.tlay>.tcol{display:flex;flex-direction:column;gap:22px;min-width:0}
.rtoc{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;font-size:13.5px;border-left:1px solid var(--line-2);padding-left:14px}
.rtoc b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.rtoc a{display:block;padding:5px 8px;margin-left:-15px;border-left:2px solid transparent;color:var(--ink-2);text-decoration:none;line-height:1.4}
.rtoc a:hover{color:var(--ink)}
.rtoc a[aria-current="true"]{border-left-color:var(--accent);color:var(--accent);font-weight:600}
.tlay .toc{display:none}
@media (max-width:1180px){.tlay{grid-template-columns:minmax(0,1fr)}.rtoc{display:none}.tlay .toc{display:flex}}
/* diagram legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;gap:8px;align-items:center}
.legend svg{flex:none}
.legend .edge{fill:none;stroke-width:2.5}
.legend .edge.primary{stroke:var(--accent)} .legend .edge.backup{stroke:var(--amber)} .legend .edge.deny{stroke:var(--red)} .legend .edge.data{stroke:var(--s1)}
.legend .edge.dashed{stroke-dasharray:7 5} .legend .edge.double{stroke-width:7;opacity:.35}
/* glossary */
.gl{all:unset;cursor:help;border-bottom:1.5px dotted var(--violet);color:inherit}
.gl:hover,.gl:focus-visible{background:var(--violet-soft);border-bottom-style:solid}
#glpop{position:absolute;z-index:20;width:min(380px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px 14px;font-size:14px;line-height:1.55}
#glpop[hidden]{display:none}
#glpop h4{margin:0;font:600 15px var(--f-body)}
#glpop .full{color:var(--ink-3);font-size:12.5px}
#glpop .md{margin:6px 0}
#glpop .rel{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#glpop .rel a,#glpop .rel button{font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);text-decoration:none;color:var(--ink-2);cursor:pointer;display:inline-flex;gap:5px;align-items:center}
#glpop .rel img{width:16px;height:16px}
#glpop .lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:8px}
.gterm{scroll-margin-top:70px}
.gterm h3{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.gterm h3 small{font:400 13px var(--f-body);color:var(--ink-3)}
.gterm .rel{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12.5px}
.gterm .rel a{padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);text-decoration:none;color:var(--ink-2);display:inline-flex;gap:5px;align-items:center}
.gterm .rel img{width:16px;height:16px}
.gdef{margin:6px 0 0}
.gdef dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--violet);margin-top:6px}
.gdef dd{margin:0}.gdef dd>*{margin:0}.gdef ul{padding-left:18px}
.glinks{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);display:grid;gap:6px}
.grow .lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.gtopic{font-size:12.5px;margin-top:3px}.gtopic b{display:block;font-weight:600;color:var(--ink-2);margin-bottom:3px}
.grow .rel{margin-top:0}
.gterm:target{border-color:var(--violet);box-shadow:0 0 0 2px var(--violet-soft)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.gfilter{width:100%;font:15px var(--f-body);border:1px solid var(--line-2);border-radius:8px;padding:9px 12px;background:var(--panel);color:var(--ink)}
.sec{display:flex;flex-direction:column;gap:14px;scroll-margin-top:70px}
.sec>h2{font-size:24px;font-weight:800;display:flex;gap:10px;align-items:center;padding-top:14px;border-top:1px solid var(--line-2)}
.sec>h2 img{width:30px;height:30px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card>h3{font-size:16px;font-weight:600;font-family:var(--f-body);margin-bottom:10px}
.md p{margin:0 0 .5em} .md p:last-child{margin:0} .md ul{margin:.2em 0 .5em;padding-left:1.2em}
.text{max-width:72ch}
.src{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:12px}
.src a{display:inline-flex;gap:5px;align-items:center;padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);text-decoration:none;color:var(--ink-2)}
.src a::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}
.callout{border-radius:var(--r);padding:12px 16px;border:1px solid;display:flex;flex-direction:column;gap:4px}
.callout .t{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
.callout .t span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:4px;color:var(--panel)}
.callout.tip{background:var(--accent-soft);border-color:var(--accent)} .callout.tip .t span{background:var(--accent)}
.callout.trap{background:var(--red-soft);border-color:var(--red)} .callout.trap .t span{background:var(--red)}
.callout.new{background:var(--violet-soft);border-color:var(--violet)} .callout.new .t span{background:var(--violet)}
.callout.exam{background:var(--amber-soft);border-color:var(--amber)} .callout.exam .t span{background:var(--amber)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.dec td:first-child{font-family:var(--f-mono);font-size:13px;color:var(--ink)}
.dec td:nth-child(2){font-weight:600;color:var(--accent)}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.cmp{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--bg);display:flex;flex-direction:column;gap:6px;min-width:0}
.cmp .h{display:flex;gap:8px;align-items:center;font-weight:600}
.cmp .h img{width:28px;height:28px}
.cmp .h{flex-wrap:wrap}.cmp .h .chip{margin-left:auto;white-space:normal}
.cmp ul{margin:0;padding-left:1.1em;font-size:14px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps>li{display:grid;grid-template-columns:30px 1fr;gap:10px;counter-increment:s}
.steps>li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:600}
.steps>li>div>b{display:block}
/* diagram */
.dg{overflow-x:auto;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.dg{display:flex;justify-content:center}
.dg svg{display:block;max-width:100%;height:auto;flex:none}
@media (max-width:700px){.dg{justify-content:flex-start}.dg svg{max-width:none;width:min(var(--w),1.0*var(--w))}}
.dg .gbox{fill:none;stroke-width:1.5}
.dg .glab{font:600 14px var(--f-body);fill:var(--ink-2)}
.g-cloud{stroke:var(--ink-3)} .g-region{stroke:var(--s1);stroke-dasharray:6 4} .g-vpc{stroke:var(--s3)} .g-subnet{stroke:var(--line-2);fill:var(--grid)!important}
.g-account{stroke:var(--violet)} .g-org{stroke:var(--violet);stroke-dasharray:3 3} .g-onprem{stroke:var(--ink-3);stroke-dasharray:8 4} .g-ou{stroke:var(--amber)}
.g-workspace{stroke:var(--s1)} .g-catalog{stroke:var(--violet)} .g-zone{stroke:var(--s3);stroke-dasharray:6 4} .g-external{stroke:var(--ink-3);stroke-dasharray:8 4} .g-service{stroke:var(--accent)}
.dg .node{cursor:pointer}
.dg .node .hit{fill:transparent;stroke:transparent;rx:10}
.dg .node:hover .hit,.dg .node.sel .hit{fill:var(--panel);stroke:var(--accent)}
.dg .nlab{font:600 15px var(--f-body);fill:var(--ink);text-anchor:middle}
.dg .nsub{font:12px var(--f-mono);fill:var(--ink-3);text-anchor:middle}
.dg .edge{fill:none;stroke-width:2}
.dg .edge.primary{stroke:var(--accent)} .dg .edge.backup{stroke:var(--amber)} .dg .edge.deny{stroke:var(--red)} .dg .edge.data{stroke:var(--s1)}
.ahf-primary{fill:var(--accent)} .ahf-backup{fill:var(--amber)} .ahf-deny{fill:var(--red)} .ahf-data{fill:var(--s1)}
.dg .edge.dashed{stroke-dasharray:7 5} .dg .edge.double{stroke-width:6;opacity:.35}
.dg .elab rect{fill:var(--panel);stroke:var(--line)} .dg .elab text{font:13px var(--f-body);fill:var(--ink-2);text-anchor:middle}
.dg.stepping .node,.dg.stepping .edgeg,.dg.stepping .elab{opacity:.22;transition:opacity .25s}
.dg.stepping .hl{opacity:1!important}
.dg.stepping .edgeg.hl .edge{stroke-width:3.5}
@media (prefers-reduced-motion:no-preference){.dg.stepping .edgeg.hl .edge:not(.double){stroke-dasharray:8 6;animation:flow 1s linear infinite}}
@keyframes flow{to{stroke-dashoffset:-14}}
.dg-info{margin-top:10px;font-size:14px;color:var(--ink-2)}
.dg-info:empty{display:none}
.dg-info b{color:var(--ink)}
.stepper{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.stepbox{border-left:3px solid var(--accent);padding:6px 12px;background:var(--accent-soft);border-radius:0 8px 8px 0;margin-top:8px}
.stepbox b{display:block}
.caption{font-size:13px;color:var(--ink-3);margin-top:6px}
.fig{margin:0}
.fig .zoom{display:block;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:zoom-in}
.fig img{display:block;max-width:100%;max-height:560px;margin:0 auto;object-fit:contain;height:auto}
.fig .kindtag{font:11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-right:6px}
.fig .credit{font-size:12px;color:var(--ink-3);margin-top:4px;overflow-wrap:anywhere}
.fig .credit a{color:var(--ink-2)}
.fig .miss{padding:24px;text-align:center;color:#555;font-size:14px}
#lbox{max-width:96vw;max-height:94vh;padding:0;border:0;border-radius:10px;background:#fff}
#lbox::backdrop{background:rgba(0,0,0,.75)}
#lbox img{display:block;max-width:94vw;max-height:88vh;object-fit:contain}
#lbox form{position:absolute;top:6px;right:6px}
.res a .rh{display:flex;gap:8px;align-items:center}
.res a .rh img{width:16px;height:16px;flex:none;border-radius:3px}
/* code */
.code{font-family:var(--f-mono);font-size:13px;line-height:1.55;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow-x:auto;padding:10px 0}
.code .ln{display:grid;grid-template-columns:44px 1fr;white-space:pre}
.code .ln i{font-style:normal;color:var(--ink-3);text-align:right;padding-right:12px;user-select:none}
.code .ln.noted{background:var(--amber-soft)}
.code .ln.noted i{color:var(--amber);font-weight:600}
.notes{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.notes li{display:grid;grid-template-columns:auto 1fr;gap:8px}
.notes li span{font-family:var(--f-mono);font-size:12px;color:var(--amber);font-weight:600;padding-top:2px}
.hljs-attr,.hljs-attribute{color:var(--s1)} .hljs-string{color:var(--green)} .hljs-number,.hljs-literal{color:var(--s2)} .hljs-keyword,.hljs-built_in{color:var(--violet)} .hljs-comment{color:var(--ink-3);font-style:italic}
.chartbox{position:relative;height:300px}
/* home */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile .k{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-family:var(--f-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .s{font-size:13px;color:var(--ink-2)}
.tile.warn{border-color:var(--amber);background:var(--amber-soft)}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;text-align:left;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:10px 12px;cursor:pointer;line-height:1.55}
.opt .k{width:24px;height:24px;border-radius:6px;border:1px solid var(--line-2);display:grid;place-items:center;font-size:12px;font-weight:600}
.opt:hover{border-color:var(--accent)}
.opt.pick{border-color:var(--accent);background:var(--accent-soft)} .opt.pick .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

<body>
<div class="app">
  <aside class="side" aria-label="Mục lục">

  <div class="main">

  <div class="sq"><img src="icons/%ICON%.svg" width="22" height="22" alt=""><input id="sinput" type="search" placeholder="Ví dụ: %HINT%" autocomplete="off"><button class="btn" id="sclose">Esc</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const SITE=/*SITE*/null;
const TOPICS=SITE.topics,QUIZ_FILES=TOPICS.map(t=>t.id),DOMAINS=SITE.domains,TASKS=SITE.tasks,GUIDE=SITE.guide,NI=SITE.navIcons;
const wl=k=>DOMAINS[k].wl||DOMAINS[k].w+"%";
const BOX_DAYS=[0,1,2,4,7,14];
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon=n=>`icons/${n}.svg`;
const cache={};
$("#lbox").addEventListener("click",e=>{if(e.target.id==="lbox")e.target.close()});
const FAV=new Set(SITE.fav||[]),host=u=>{try{return new URL(u).hostname}catch{return""}};
async function load(p){if(!(p in cache)){cache[p]=fetch(p).then(r=>r.ok?r.json():null).catch(()=>null)}return cache[p]}

/* ---------- inline markdown ---------- */
function inl(s){
  let t=esc(s);
  t=t.replace(/`([^`]+)`/g,"<code>$1</code>");
  t=t.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  t=t.replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<i>$2</i>");
  t=t.replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return t;
}
function md(s){
  const lines=String(s??"").split("\n");let out="",ul=false,fence=null;
  for(const l of lines){
    if(fence){if(/^\s*```\s*$/.test(l)){out+=`<div class="code">${fence.map((c,i)=>`<div class="ln"><i>${i+1}</i><span>${esc(c)||" "}</span></div>`).join("")}</div>`;fence=null}else fence.push(l);continue}
    if(/^\s*```/.test(l)){if(ul){out+="</ul>";ul=false}fence=[];continue}
    if(/^\s*-\s+/.test(l)){if(!ul){out+="<ul>";ul=true}out+="<li>"+inl(l.replace(/^\s*-\s+/,""))+"</li>"}
    else{if(ul){out+="</ul>";ul=false}if(l.trim())out+="<p>"+inl(l)+"</p>"}
  }
  if(ul)out+="</ul>";
  if(fence)out+=`<div class="code">${fence.map((c,i)=>`<div class="ln"><i>${i+1}</i><span>${esc(c)||" "}</span></div>`).join("")}</div>`;
  return `<div class="md">${out}</div>`;
}
function srcs(src){
  if(!src)return"";const a=Array.isArray(src)?src:[src];
  return `<div class="src">${a.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join("")}</div>`;
}

/* ---------- progress: localStorage, optional sync to Supabase by secret code ---------- */
const SB="https://hnpixqdvxszxjwovtusr.supabase.co/rest/v1/rpc/",SBK="sb_publishable_gBwAT34fKCkXmMvKVtc7cA_6wR944Sk";
const rpc=(fn,body)=>fetch(SB+fn,{method:"POST",headers:{apikey:SBK,"Content-Type":"application/json"},body:JSON.stringify(body)}).then(r=>{if(!r.ok)throw new Error(r.status);return r.status===204?null:r.json()});
const store={state:{quiz:{},cards:{}},code:null,status:"",timer:null,
  init(){
    try{const s=JSON.parse(localStorage.getItem(SITE.storeKey)||"null");if(s){this.state.quiz=s.quiz||{};this.state.cards=s.cards||{}}}catch(e){}
    try{this.code=localStorage.getItem(SITE.syncKey)}catch(e){}
    if(!this.fromHash()&&this.code)this.pull();
  },
  fromHash(){const m=location.hash.match(/^#sync=([A-Za-z0-9]{24,64})$/);if(!m)return false;this.setCode(m[1]);history.replaceState(null,"",location.pathname+"#home");this.pull();return true},
  setCode(c){this.code=c;try{localStorage.setItem(SITE.syncKey,c)}catch(e){}},
  merge(r){for(const k of["quiz","cards"])for(const[id,v]of Object.entries(r?.[k]||{})){const l=this.state[k][id];if(!l||(v.t||0)>(l.t||0))this.state[k][id]=v}},
  async pull(){try{this.merge(await rpc("get_progress",{p_code:this.code}));this.saveLocal();this.status="Đã đồng bộ "+new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});await this.push();render()}catch(e){this.status="Chưa kết nối được server đồng bộ";render()}},
  async push(){if(!this.code)return;try{await rpc("save_progress",{p_code:this.code,p_data:this.state});this.status="Đã lưu lên server lúc "+new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})}catch(e){this.status="Lưu lên server lỗi, sẽ thử lại ở lần lưu sau"}const el=$("#syncStatus");if(el)el.textContent=this.status},
  saveLocal(){try{localStorage.setItem(SITE.storeKey,JSON.stringify(this.state))}catch(e){}},
  save(){this.saveLocal();if(this.code){clearTimeout(this.timer);this.timer=setTimeout(()=>this.push(),1500)}},
  async enable(){const a=new Uint8Array(16);crypto.getRandomValues(a);this.setCode([...a].map(b=>b.toString(16).padStart(2,"0")).join(""));await this.push();render()},
  link(){return location.origin+location.pathname+"#sync="+this.code}};
function syncCard(){
  if(!store.code)return `<div class="card"><h3>Đồng bộ tiến độ giữa các máy</h3><button class="btn pri" id="syncOn">Bật đồng bộ</button></div>`;
  return `<div class="card"><h3>Đồng bộ tiến độ giữa các máy</h3><p class="muted" style="margin:0 0 10px">Ai có link này đều sửa được tiến độ của bạn.</p>
   <div class="row"><input id="syncLink" readonly value="${esc(store.link())}" style="flex:1;min-width:0;font:13px var(--f-mono);border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;background:var(--bg);color:var(--ink)"><button class="btn" id="syncCopy">Copy link</button></div>
   <div class="caption" id="syncStatus">${esc(store.status||"Đồng bộ đang bật.")}</div></div>`;
}
function wireSync(){
  const on=$("#syncOn");if(on)on.onclick=()=>{on.disabled=true;store.enable()};
  const cp=$("#syncCopy");if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(store.link());cp.textContent="Đã copy"}catch(e){$("#syncLink").select()}};
}

/* ---------- nav ---------- */
const PRACTICE=[{id:"quiz",title:"Quiz và mock exam",icon:NI.quiz},{id:"cards",title:"Flashcard",icon:NI.cards}];
function route(){return (location.hash||"#home").slice(1).split(".")[0]||"home"}
function buildNav(){
  const cur=route(),on=id=>id===cur||(id==="quiz"&&cur==="q");
  const link=t=>`<a href="#${t.id}" ${on(t.id)?'aria-current="page"':""}><img src="${icon(t.icon)}" alt="">${esc(t.title)}<span class="pc" data-pc="${t.id}"></span></a>`;
  const top=[{id:"home",title:"Trang chính",icon:SITE.icon},{id:"glossary",title:"Thuật ngữ",icon:NI.glossary},{id:"resources",title:"Nguồn học",icon:NI.resources}];
  $("#nav").innerHTML=`${top.map(link).join("")}<div class="lab">Chương học</div>${TOPICS.map(link).join("")}<div class="lab">Luyện đề</div>${PRACTICE.map(link).join("")}`;
  $("#mtabs").innerHTML=`<a href="#" data-search><img src="${icon(SITE.icon)}" alt="">Tìm</a>`+[...top,...TOPICS,...PRACTICE].map(t=>`<a href="#${t.id}" ${on(t.id)?'aria-current="page"':""}><img src="${icon(t.icon)}" alt="">${esc(t.title)}</a>`).join("")+`<button class="tbtn" data-theme-btn></button>`;
  paintTheme();
  const a=$("#mtabs [aria-current]");if(a)a.scrollIntoView({block:"nearest",inline:"center"});
}

/* ---------- block renderers ---------- */
const charts=[];
function blockHTML(b,i){
  const id="b"+i;
  switch(b.type){
    case"text":return `<div class="text">${md(b.md)}${srcs(b.src)}</div>`;
    case"callout":{const L={tip:"Tip",trap:"Trap",new:"New",exam:"Exam"}[b.tone]||"Note";
      return `<div class="callout ${esc(b.tone)}"><div class="t"><span>${L}</span>${esc(b.title||"")}</div>${md(b.md)}${srcs(b.src)}</div>`}
    case"table":return `<div class="card">${b.title?`<h3>${esc(b.title)}</h3>`:""}<div class="tbl"><table><thead><tr>${b.columns.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${srcs(b.src)}</div>`;
    case"decision":return decisionHTML(b.title||"Đề nói gì thì chọn gì",b.rows,b.src);
    case"compare":return `<div class="card">${b.title?`<h3>${esc(b.title)}</h3>`:""}<div class="compare">${b.items.map(it=>`<div class="cmp"><div class="h">${it.icon?`<img src="${icon(it.icon)}" alt="">`:""}${esc(it.name)}${it.tag?`<span class="chip">${esc(it.tag)}</span>`:""}</div><ul>${(it.points||[]).map(p=>`<li>${inl(p)}</li>`).join("")}</ul></div>`).join("")}</div>${srcs(b.src)}</div>`;
    case"steps":return `<div class="card">${b.title?`<h3>${esc(b.title)}</h3>`:""}<ol class="steps">${b.items.map(s=>`<li><div><b>${inl(s.title)}</b>${md(s.md||"")}</div></li>`).join("")}</ol>${srcs(b.src)}</div>`;
    case"code":return codeHTML(b);
    case"figure":return figureHTML(b);
    case"chart":return `<div class="card">${b.title?`<h3>${esc(b.title)}</h3>`:""}<div class="chartbox"><canvas id="${id}" role="img" aria-label="${esc(b.title||"chart")}"></canvas></div>${b.note?`<div class="caption">${inl(b.note)}</div>`:""}${srcs(b.src)}</div>`;
    case"diagram":return `<div class="card" data-dg="${id}">${b.title?`<h3>${esc(b.title)}</h3>`:""}<div class="dg" id="${id}" style="--w:${b.W||1000}">${b.svg||""}</div>${legendHTML(b.legend)}${b.caption?`<div class="caption">${inl(b.caption)}</div>`:""}
      ${b.steps?.length?`<div class="stepper"><button class="btn" data-act="prev">Bước trước</button><button class="btn pri" data-act="next">Xem flow: bước 1</button><button class="btn" data-act="reset">Tắt</button><span class="muted" data-n></span></div><div class="stepbox" hidden></div>`:""}
      <div class="dg-info"></div>${srcs(b.src)}</div>`;
  }
  return "";
}
/* figure: a real image from official docs, copied (licensed) or embedded from the vendor host, always credited */
const FIGKIND={diagram:"Diagram gốc",screenshot:"Ảnh giao diện",docs:"Ảnh từ docs"};
function figureHTML(b){
  const c=b.credit||{};
  return `<div class="card">${b.title?`<h3>${esc(b.title)}</h3>`:""}<figure class="fig"><button class="zoom" type="button" data-zoom="${esc(b.img)}" aria-label="Phóng to ảnh"><img src="${esc(b.img)}" alt="${esc(b.alt)}" loading="lazy" decoding="async" data-fig="${esc(c.url||"")}"></button>
   <figcaption class="caption">${b.kind?`<span class="kindtag">${esc(FIGKIND[b.kind]||b.kind)}</span>`:""}${inl(b.caption||"")}</figcaption>
   <div class="credit">Nguồn ảnh: <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.label)}</a>${c.license?`, ${c.licenseUrl?`<a href="${esc(c.licenseUrl)}" target="_blank" rel="noopener">${esc(c.license)}</a>`:esc(c.license)}`:""}</div></figure>${srcs(b.src)}</div>`;
}
function wireFigures(root){
  root.querySelectorAll("img[data-fig]").forEach(img=>img.addEventListener("error",()=>{
    const u=img.dataset.fig;img.closest(".zoom").outerHTML=`<div class="miss">Ảnh gốc không tải được. <a href="${esc(u)}" target="_blank" rel="noopener">Mở trang nguồn</a></div>`},{once:true}));
  root.querySelectorAll("[data-zoom]").forEach(b=>b.addEventListener("click",()=>{const d=$("#lbox");d.querySelector("img").src=b.dataset.zoom;d.querySelector("img").alt=b.querySelector("img")?.alt||"";d.showModal()}));
}
function legendHTML(L){
  if(!L?.length)return"";
  const line=(st,t)=>`<svg width="40" height="12" aria-hidden="true">${st==="double"?`<line x1="2" y1="6" x2="38" y2="6" class="edge ${t} double"/>`:""}<line x1="2" y1="6" x2="38" y2="6" class="edge ${t}${st==="dashed"?" dashed":""}"/></svg>`;
  return `<div class="legend">${L.map(x=>`<span>${line(x.style||"solid",x.tone||"primary")}${inl(x.label)}</span>`).join("")}</div>`;
}
function decisionHTML(title,rows,src){
  return `<div class="card"><h3>${esc(title)}</h3><div class="tbl"><table class="dec"><thead><tr><th>Đề nói</th><th>Chọn</th><th>Vì sao</th><th>Nguồn</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${inl(r.says)}</td><td>${inl(r.pick)}</td><td>${inl(r.why)}</td><td>${r.src?`<a href="${esc(r.src.url)}" target="_blank" rel="noopener">${esc(r.src.label)}</a>`:""}</td></tr>`).join("")}</tbody></table></div>${srcs(src)}</div>`;
}
function codeHTML(b){
  const notes=b.notes||[];const noted=new Map(notes.map((n,k)=>[n.line,k+1]));
  const lang=b.lang&&window.hljs?.getLanguage(b.lang)?b.lang:null;

/* ---------- diagram interactivity (layout and SVG are produced at build time) ---------- */
function wireDiagram(card,b){
  const dg=card.querySelector(".dg"),info=card.querySelector(".dg-info");
  dg.querySelectorAll(".node").forEach(g=>{
    const n=b.nodes.find(x=>x.id===g.dataset.id);if(!n)return;
    const show=()=>{dg.querySelectorAll(".node.sel").forEach(x=>x.classList.remove("sel"));g.classList.add("sel");info.innerHTML=`<b>${esc(n.label)}</b>${n.info?md(n.info):""}`;glossify(info)};
    g.addEventListener("click",show);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();show()}});
  });
  if(!b.steps?.length)return;
  let k=-1;const box=card.querySelector(".stepbox"),nxt=card.querySelector('[data-act="next"]'),prv=card.querySelector('[data-act="prev"]'),cnt=card.querySelector("[data-n]");
  const paint=()=>{
    dg.querySelectorAll(".hl").forEach(x=>x.classList.remove("hl"));
    if(k<0){dg.classList.remove("stepping");box.hidden=true;nxt.textContent="Xem flow: bước 1";cnt.textContent="";prv.disabled=true;return}
    const st=b.steps[k];dg.classList.add("stepping");
    for(const id of st.hl||[])dg.querySelectorAll(`[data-id="${CSS.escape(id)}"]`).forEach(x=>x.classList.add("hl"));
    box.hidden=false;box.innerHTML=`<b>${inl(st.title)}</b>${md(st.md||"")}`;glossify(box);
    nxt.textContent=k<b.steps.length-1?"Bước tiếp":"Xem lại từ đầu";cnt.textContent=`${k+1} / ${b.steps.length}`;prv.disabled=k<=0;
  };
  nxt.onclick=()=>{k=k<b.steps.length-1?k+1:0;paint()};
  prv.onclick=()=>{if(k>0){k--;paint()}};
  card.querySelector('[data-act="reset"]').onclick=()=>{k=-1;paint()};
  paint();
}

let spyObs=null;
function spy(sel){
  spyObs?.disconnect();
  const links=[...document.querySelectorAll("[data-spy]")];if(!links.length)return;
  const vis=new Map();
  spyObs=new IntersectionObserver(es=>{
    for(const e of es)vis.set(e.target.id,e.isIntersecting);
    const first=[...document.querySelectorAll(sel)].find(s=>vis.get(s.id));
    if(first)links.forEach(a=>a.setAttribute("aria-current",a.dataset.spy===first.id?"true":"false"));
  },{rootMargin:"-15% 0px -70% 0px"});
  document.querySelectorAll(sel).forEach(s=>spyObs.observe(s));
}

/* ---------- glossary: auto-link first mention per container, popover, glossary page ---------- */
const gloss=()=>load("data/glossary.json").then(x=>x||[]);
let GL=null,GLRX=null;
const GL_CATS=SITE.glCats;
const GL_SKIP="a,code,button,h1,h2,h3,h4,svg,.code,.stem,.opt,th,.legend,.kw,.chip,.rtoc,.toc,.src,#glpop,.dec td:first-child";
async function glossReady(){
  if(GL)return;GL=await gloss();const map=new Map(),keys=[];
  for(const g of GL)for(const a of[g.term,...(g.aliases||[])]){const k=a.toLowerCase();if(!map.has(k)){map.set(k,[g,a]);keys.push(a)}}
  keys.sort((a,b)=>b.length-a.length);
  if(keys.length)GLRX={map,re:new RegExp(`(?<![A-Za-z0-9_-])(${keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")})(?![A-Za-z0-9_-])`,"gi")};
}
function glossify(root){
  if(!GLRX||!root)return;
  const seen=new Set([...root.querySelectorAll(".gl")].map(b=>b.dataset.g));
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest(GL_SKIP)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  for(const n of nodes){
    const t=n.nodeValue;let m,last=0,frag=null;GLRX.re.lastIndex=0;
    while((m=GLRX.re.exec(t))){
      const[g,a]=GLRX.map.get(m[1].toLowerCase())||[];
      if(!g||seen.has(g.id)||(a.length<=4&&m[1]!==a))continue; // short acronyms match case-sensitively
      seen.add(g.id);frag??=document.createDocumentFragment();
      const b=document.createElement("button");b.className="gl";b.dataset.g=g.id;b.textContent=m[1];
      frag.append(t.slice(last,m.index),b);last=m.index+m[1].length;
    }
    if(frag){frag.append(t.slice(last));n.replaceWith(frag)}
  }
}

/* ---------- search ---------- */
const norm=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").toLowerCase();
let SIDX=null,sSel=0,sHits=[];
async function openSearch(){
  const d=$("#search");if(!d.open)d.showModal();
  const inp=$("#sinput");inp.select();inp.focus();
  if(!SIDX){const raw=(await load("data/search.json"))||[];SIDX=raw.map(e=>({...e,nt:norm(e.title),na:norm(e.title+" "+e.sub+" "+e.text)}))}
  runSearch();
}
function runSearch(){
  const q=norm($("#sinput").value.trim()),toks=q.split(/\s+/).filter(Boolean),box=$("#sres");
  if(!SIDX){box.innerHTML=`<div class="empty">Đang tải chỉ mục tìm kiếm...</div>`;sHits=[];return}
  if(!toks.length){box.innerHTML=`<div class="lab">Gợi ý</div>${(SITE.suggest||SITE.hint.split(/,\s*/)).map(x=>`<a href="#" data-q="${x}"><span class="ph">?</span><div><b>${x}</b></div></a>`).join("")}`;
    box.querySelectorAll("[data-q]").forEach(a=>a.onclick=e=>{e.preventDefault();$("#sinput").value=a.dataset.q;runSearch()});sHits=[];return}
  const W={service:40,term:30,section:20,card:5,quiz:0};
  sHits=SIDX.filter(e=>toks.every(t=>e.na.includes(t))).map(e=>{let sc=W[e.type];
    if(e.nt===q)sc+=200;else if(e.nt.startsWith(q))sc+=120;else if(e.nt.includes(q))sc+=80;else if(toks.every(t=>e.nt.includes(t)))sc+=50;return[sc,e]})
    .sort((a,b)=>b[0]-a[0]).slice(0,40).map(x=>x[1]);
  const ORD=["service","term","section","card","quiz"];sHits.sort((a,b)=>ORD.indexOf(a.type)-ORD.indexOf(b.type));
  sSel=0;
  const L={service:"Service",term:"Thuật ngữ",section:"Mục trong chủ đề",card:"Flashcard",quiz:"Quiz"},hl=s=>{let h=esc(s);for(const t of toks){const i=norm(s).indexOf(t);if(i>=0){h=esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+t.length))+"</mark>"+esc(s.slice(i+t.length));break}}return h};
  let html="",last="";
  sHits.forEach((e,i)=>{if(e.type!==last){html+=`<div class="lab">${L[e.type]}</div>`;last=e.type}
    html+=`<a href="${esc(e.href)}" data-i="${i}">${e.icon?`<img src="${icon(e.icon)}" alt="">`:`<span class="ph">${{quiz:"Q",card:"F",term:"T"}[e.type]||"?"}</span>`}<div><b>${hl(e.title)}</b><small>${esc(plain(e.sub))}</small></div></a>`});
  box.innerHTML=html||`<div class="empty">Không có kết quả cho "${esc($("#sinput").value)}".</div>`;
  paintSel();
}
function paintSel(){document.querySelectorAll("#sres a[data-i]").forEach(a=>a.classList.toggle("on",+a.dataset.i===sSel));const a=$(`#sres a[data-i="${sSel}"]`);if(a)a.scrollIntoView({block:"nearest"})}
function wireSearch(){
  document.addEventListener("click",e=>{const b=e.target.closest("[data-search]");if(b){e.preventDefault();openSearch()}});
  document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"||(e.key==="/"&&!/input|textarea|select/i.test(document.activeElement.tagName))){e.preventDefault();openSearch()}});
  $("#sinput").addEventListener("input",runSearch);
  $("#sinput").addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){e.preventDefault();sSel=Math.min(sSel+1,sHits.length-1);paintSel()}
    if(e.key==="ArrowUp"){e.preventDefault();sSel=Math.max(sSel-1,0);paintSel()}
    if(e.key==="Enter"&&sHits[sSel]){e.preventDefault();location.hash=sHits[sSel].href;$("#search").close()}});
  $("#sres").addEventListener("click",e=>{if(e.target.closest("a[data-i]"))$("#search").close()});
  $("#sclose").onclick=()=>$("#search").close();

}

const QZ={filter:"all",only:"all",idx:0,list:[],picked:[],shown:false,mock:null};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
async function viewQuiz(sub,byId){

   <div class="qtools"><select id="only" aria-label="Lọc câu"><option value="all">Mọi câu</option><option value="new" ${QZ.only==="new"?"selected":""}>Chưa làm</option><option value="wrong" ${QZ.only==="wrong"?"selected":""}>Đã làm sai</option></select>
    ${SITE.mocks.map((m,i)=>`<button class="btn" data-mock="${i}">Mock exam ${m.n} câu (${m.min} phút${m.note?", "+esc(m.note):""})</button>`).join("")}</div>`;

    after(){wireQuizTools();wireQuestion(q,QZ,true,()=>{render()});glossify($(".qcard"))}};

function wireQuizTools(){
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{QZ.filter=b.dataset.f;QZ.list=[];QZ.idx=0;location.hash="quiz."+b.dataset.f});
  const o=$("#only");if(o)o.onchange=()=>{QZ.only=o.value;QZ.list=[];QZ.idx=0;render()};
  const p=$("#qprev"),n=$("#qnext");
  const go=d=>{const a=QZ.list[QZ.idx],b=QZ.list[QZ.idx+d];if(!b||a.case!==b.case)CASE_TAB.i=0;QZ.idx+=d;QZ.picked=[];QZ.shown=false;render()};
  if(p)p.onclick=()=>go(-1);
  if(n)n.onclick=()=>go(1);
  document.querySelectorAll("[data-mock]").forEach(b=>b.onclick=()=>startMock(SITE.mocks[+b.dataset.mock]));
}
/* question types: choice (default), yesno, hotarea, order; field case links a case study in data/cases/<id>.json */
const CASES={},CASE_TAB={i:0,open:true};
async function loadCase(q){if(q&&q.case&&!(q.case in CASES))CASES[q.case]=await load(`data/cases/${q.case}.json`);return q&&q.case?CASES[q.case]:null}
const qType=q=>q.type||"choice";
function keyOf(q){return qType(q)==="hotarea"?q.slots.map(s=>String(s.answer)):q.answer}
function grade(q,p){p=p||[];const t=qType(q),a=keyOf(q);if(t==="order"||t==="hotarea")return p.length===a.length&&a.every((x,i)=>p[i]===x);return sameSet(p,a)}
function ready(q,p){if(qType(q)==="hotarea")return q.slots.every((s,i)=>p[i]!=null&&p[i]!=="");return p.length===q.select}
function ansText(q,p){
  p=p||[];if(!p.some(x=>x!=null&&x!==""))return"";
  if(qType(q)==="hotarea")return q.slots.map((s,i)=>`[${i+1}] ${p[i]!=null&&p[i]!==""?s.options[+p[i]]:"?"}`).join("; ");
  return p.join(qType(q)==="order"?" → ":", ");
}
const plainOpt=s=>String(s).replace(/`/g,"");
function typeChip(q){
  const t=qType(q);
  if(t==="yesno")return `<span class="chip">Yes/No series</span>`;
  if(t==="hotarea")return `<span class="chip">Hot area</span>`;
  if(t==="order")return `<span class="chip">Drag and drop: xếp ${q.select} bước</span>`;
  return q.select>1?`<span class="chip">Select ${["","ONE","TWO","THREE"][q.select]}</span>`:"";
}
function caseHTML(q){
  const c=q.case&&CASES[q.case];if(!c)return"";const i=Math.min(CASE_TAB.i,c.tabs.length-1);
  return `<details class="case card" id="casebox" ${CASE_TAB.open?"open":""}><summary><b>Case study: ${esc(c.title)}</b> <span class="muted">(đọc kịch bản trước khi trả lời)</span></summary>
   <div class="qtools ctabs">${c.tabs.map((t,j)=>`<button class="chip ${j===i?"on":""}" data-ctab="${j}">${esc(t.t)}</button>`).join("")}</div>
   <div class="stem">${md(c.tabs[i].md)}</div></details>`;
}
function bodyHTML(q,S){
  const t=qType(q),p=S.picked||[],shown=S.shown;
  if(t==="hotarea")return `<div class="hot">${q.slots.map((s,i)=>{const v=p[i]??"",ok=v===String(s.answer);
    return `<label class="hrow ${shown?(ok?"right":"wrong"):""}"><span>${inl(s.label)}</span><select data-slot="${i}" ${shown?"disabled":""} aria-label="${esc(plainOpt(s.label))}"><option value="">Chọn...</option>${s.options.map((o,j)=>`<option value="${j}" ${v===String(j)?"selected":""}>${esc(plainOpt(o))}</option>`).join("")}</select>${shown&&!ok?`<span class="why">Đáp án: ${inl(s.options[s.answer])}</span>`:""}</label>`}).join("")}</div>`;
  if(t==="order"){
    const pool=q.options.filter(o=>!p.includes(o.k));
    return `<div class="dnd"><div><div class="muted">Actions</div>${pool.map(o=>`<button class="opt" data-add="${o.k}" ${shown||p.length>=q.select?"disabled":""}><span class="k">${o.k}</span><span>${inl(o.t)}</span>${shown&&q.wrong?.[o.k]?`<span class="why">${inl(q.wrong[o.k])}</span>`:""}</button>`).join("")||`<div class="empty">Đã dùng hết action.</div>`}</div>
     <div><div class="muted">Answer area (${p.length}/${q.select})</div>${p.map((k,i)=>{const o=q.options.find(x=>x.k===k)||{t:k};const c=shown?(q.answer[i]===k?"right":"wrong"):"pick";
      return `<div class="opt drow ${c}"><span class="k">${i+1}</span><span>${inl(o.t)}${shown&&q.wrong?.[k]?`<span class="why">${inl(q.wrong[k])}</span>`:""}</span>${shown?"":`<span class="dbtn"><button class="btn" data-up="${i}" ${i?"":"disabled"} aria-label="Đưa lên">↑</button><button class="btn" data-rm="${i}" aria-label="Bỏ ra">✕</button></span>`}</div>`}).join("")||`<div class="empty">Chọn action bên trái để đưa vào đây theo đúng thứ tự.</div>`}</div></div>`;
  }
  const ans=new Set(q.answer);
  return `<div class="opts">${q.options.map(o=>{
     const pk=p.includes(o.k);let cls=pk?"pick":"";
     if(shown){cls=ans.has(o.k)?"right":(pk?"wrong":"")}
     return `<button class="opt ${cls}" data-k="${o.k}" ${shown?"disabled":""}><span class="k">${o.k}</span><span>${inl(o.t)}</span>${shown&&q.wrong?.[o.k]?`<span class="why">${inl(q.wrong[o.k])}</span>`:""}</button>`}).join("")}</div>`;
}
function questionHTML(q,S,practice,note){
  const shown=S.shown,ok=shown&&grade(q,S.picked);
  const tname=(TOPICS.find(t=>t.id===q.topic)||{title:q.topic}).title;
  const hint=qType(q)==="hotarea"?"Chọn giá trị cho mọi ô":qType(q)==="order"?`Xếp ${q.select} action theo đúng thứ tự`:`Chọn ${q.select} đáp án`;
  return `${caseHTML(q)}<article class="card qcard"><div class="qmeta"><span class="chip">${esc(q.domain)} ${DOMAINS[q.domain]?esc(DOMAINS[q.domain].n):""}</span><span class="chip">${esc(tname)}</span>${q.task?`<span class="chip" title="${esc(TASKS[q.task]||"")}">Task ${esc(q.task)}</span>`:""}${q.case?`<span class="chip">Case study</span>`:""}${typeChip(q)}</div>
   ${note?`<div class="qnote">${note}</div>`:""}
   <div class="stem">${md(q.stem)}</div>
   ${bodyHTML(q,S)}
   ${practice?(shown?`<div class="verdict ${ok?"ok":"no"}">${ok?"Đúng":"Chưa đúng. Đáp án: "+esc(plainOpt(ansText(q,keyOf(q))))}</div>${md(q.explain)}${srcs(q.refs)}`
     :`<div class="row"><button class="btn pri" id="qsub" ${ready(q,S.picked)?"":"disabled"}>Chấm câu này</button><span class="muted">${hint}</span></div>`):""}
  </article>`;
}
function sameSet(a,b){return a.length===b.length&&a.every(x=>b.includes(x))}
function wireQuestion(q,S,practice,done){
  const t=qType(q),cur=()=>(S.picked||[]).slice();
  document.querySelectorAll(".opt[data-k]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(q.select===1)S.picked=[k];else S.picked=S.picked.includes(k)?S.picked.filter(x=>x!==k):(S.picked.length<q.select?[...S.picked,k]:S.picked);
    done();
  });
  document.querySelectorAll("[data-slot]").forEach(el=>el.onchange=()=>{const a=Array.from({length:q.slots.length},(_,i)=>(S.picked||[])[i]??"");a[+el.dataset.slot]=el.value;S.picked=a;done()});
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const a=cur();if(a.length<q.select&&!a.includes(b.dataset.add))a.push(b.dataset.add);S.picked=a;done()});
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const a=cur();a.splice(+b.dataset.rm,1);S.picked=a;done()});
  document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{const a=cur(),i=+b.dataset.up;[a[i-1],a[i]]=[a[i],a[i-1]];S.picked=a;done()});
  document.querySelectorAll("[data-ctab]").forEach(b=>b.onclick=()=>{CASE_TAB.i=+b.dataset.ctab;CASE_TAB.open=true;done()});
  const cb=$("#casebox");if(cb)cb.ontoggle=()=>{CASE_TAB.open=cb.open};
  const s=$("#qsub");if(s)s.onclick=()=>{S.shown=true;const ok=grade(q,S.picked);const prev=store.state.quiz[q.id];
    store.state.quiz[q.id]={ok,n:(prev?.n||0)+1,t:Date.now()};store.save();done()};
}
async function startMock(m){
  const n=m.n,qs=await allQuiz();
  // A full-length mock ends with one whole case study, as the real exam does.
  const cids=[...new Set(qs.filter(q=>q.case).map(q=>q.case))];
  const cid=n>=40&&cids.length?shuffle(cids)[0]:null,caseQs=cid?qs.filter(q=>q.case===cid).sort((a,b)=>a.id<b.id?-1:1):[];
  const rest=n-caseQs.length;
  // Units keep a Yes/No series together; sample units by domain weight, then fill any shortfall.
  const units=[],seen=new Set();
  for(const q of qs){if(q.case)continue;const u=q.series||q.id;if(seen.has(u))continue;seen.add(u);units.push(q.series?qs.filter(x=>!x.case&&x.series===q.series):[q])}
  const pick=[];let total=0;
  for(const[k,d]of Object.entries(DOMAINS)){const want=Math.round(rest*d.w/100);let c=0;for(const u of shuffle(units.filter(u=>u[0].domain===k))){if(c>=want)break;pick.push(u);c+=u.length;total+=u.length}}
  for(const u of shuffle(units.filter(u=>!pick.includes(u)))){if(total>=rest)break;pick.push(u);total+=u.length}
  while(total>rest){const i=pick.findIndex(u=>u.length===1);if(i<0)break;pick.splice(i,1);total--}
  const list=[...shuffle(pick).flat(),...caseQs];
  CASE_TAB.i=0;CASE_TAB.open=true;
  QZ.mock={list,i:0,ans:{},end:Date.now()+m.min*60000*list.length/n,done:false};
  render();
}
// Like the real exam: a Yes/No series item cannot be revisited, and a case study section cannot go back to earlier questions.
function mockLocked(M){const q=M.list[M.i],p=M.list[M.i-1];return !p||!!q.series||!!p.series||(!!q.case&&p.case!==q.case)}
function mockNote(M){
  const q=M.list[M.i],p=M.list[M.i-1];
  if(q.series)return "Chuỗi Yes/No: các câu cùng mục tiêu, mỗi câu một giải pháp khác. Sau khi sang câu khác, bạn không quay lại câu này được.";
  if(q.case&&(!p||p.case!==q.case))return "Bắt đầu phần case study. Từ đây không quay lại các câu trước được; trong phần này vẫn quay lại được câu của cùng case.";
  return "";
}
let tick=null;

    const res=M.list.map(q=>({q,ok:grade(q,M.ans[q.id])}));const score=res.filter(r=>r.ok).length;
    const byDom=Object.keys(DOMAINS).map(k=>{const r=res.filter(x=>x.q.domain===k);return `<tr><td>${k} ${esc(DOMAINS[k].n)}</td><td>${r.filter(x=>x.ok).length}/${r.length}</td></tr>`}).join("");
    return {html:`<header class="hero"><img src="${icon(NI.quiz)}" alt=""><div><h1>Mock exam: ${score}/${M.list.length} (${Math.round(100*score/M.list.length)}%)</h1></div></header>
      <div class="card"><div class="tbl"><table><thead><tr><th>Domain</th><th>Đúng</th></tr></thead><tbody>${byDom}</tbody></table></div></div>
      <div class="card"><h3>Xem lại</h3><ol>${res.map(r=>`<li><a href="#q.${r.q.id}">${esc(r.q.id)}</a>${r.q.case?" (case study)":""}: ${r.ok?"đúng":"sai, đáp án "+esc(plainOpt(ansText(r.q,keyOf(r.q))))+", bạn chọn "+(esc(plainOpt(ansText(r.q,M.ans[r.q.id])))||"bỏ trống")}</li>`).join("")}</ol></div>
      <button class="btn pri" id="mclose">Về quiz</button>`,after(){$("#mclose").onclick=()=>{QZ.mock=null;render()}}};
  }

  return {html:`<div class="row"><b>Mock exam</b><span class="muted">Câu ${M.i+1}/${M.list.length}</span><span class="timer chip" id="tmr"></span><button class="btn" id="mfinish">Nộp bài</button></div>
     ${questionHTML(q,S,false,mockNote(M))}
     <div class="row"><button class="btn" id="mprev" ${mockLocked(M)?"disabled":""}>Câu trước</button><button class="btn pri" id="mnext">${M.i<M.list.length-1?"Câu sau":"Nộp bài"}</button></div>`,
    after(){
      wireQuestion(q,S,false,()=>{M.ans[q.id]=S.picked;render()});
      const fin=()=>{M.done=true;clearInterval(tick);for(const x of M.list){const ok=grade(x,M.ans[x.id]);const prev=store.state.quiz[x.id];store.state.quiz[x.id]={ok,n:(prev?.n||0)+1,t:Date.now()}}store.save();render()};
      const step=d=>{const nx=M.list[M.i+d];if(!nx||nx.case!==q.case)CASE_TAB.i=0;M.i+=d;render()};
      $("#mprev").onclick=()=>step(-1);$("#mnext").onclick=()=>{if(M.i<M.list.length-1)step(1);else fin()};$("#mfinish").onclick=fin;
      const up=()=>{const s=Math.max(0,Math.round((M.end-Date.now())/1000));const el=$("#tmr");if(el)el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;if(!s)fin()};
      clearInterval(tick);tick=setInterval(up,1000);up();

/* ---------- flashcards: Leitner boxes ---------- */
const FC={topic:"all",cur:null,flip:false};
async function viewCards(sub){
  if(sub&&sub!==FC.topic){FC.topic=sub;FC.cur=null}
  const cs=await allCards(),C=store.state.cards,now=Date.now();
  const pool=cs.filter(c=>FC.topic==="all"||c.topic===FC.topic);
  const due=pool.filter(c=>!C[c.id]||C[c.id].due<=now);
  if(!FC.cur||!due.find(c=>c.id===FC.cur)){FC.cur=due.length?shuffle(due)[0].id:null;FC.flip=false}
  const c=pool.find(x=>x.id===FC.cur);
  const boxes=[1,2,3,4,5].map(b=>pool.filter(c=>(C[c.id]?.box||1)===b&&C[c.id]).length);const mx=Math.max(1,...boxes,pool.filter(c=>!C[c.id]).length);
  const html=`<header class="hero"><img src="${icon(NI.cards)}" alt=""><div><h1>Flashcard</h1><p>Nhớ: thẻ quay lại sau 1, 2, 4, 7, 14 ngày. Quên: thẻ về hộp 1.</p></div></header>
   <div class="qtools">${[["all","Tất cả"],...TOPICS.map(t=>[t.id,t.title])].map(([k,v])=>`<button class="chip ${FC.topic===k?"on":""}" data-t="${k}">${esc(v)}</button>`).join("")}</div>
   <div class="card"><div class="row" style="justify-content:space-between"><span><b>${due.length}</b> thẻ đến hạn / ${pool.length} thẻ</span><span class="muted">Hộp 1 tới 5</span></div>
    <div class="boxes" style="margin-top:22px">${boxes.map(n=>`<div style="height:${8+52*n/mx}px"><span>${n}</span></div>`).join("")}</div></div>
   ${c?`<div class="card flash" id="flash" role="button" tabindex="0">${FC.flip?`<div class="side-b">${md(c.back)}${srcs(c.ref)}</div>`:`<div><b>${inl(c.front)}</b></div>`}</div>
     ${FC.flip?`<div class="row"><button class="btn" id="again">Chưa nhớ</button><button class="btn pri" id="good">Nhớ rồi</button></div>`:`<div class="row"><button class="btn pri" id="flipb">Xem đáp án</button></div>`}`
     :`<div class="card empty">Hết thẻ đến hạn. Quay lại ngày mai.</div>`}`;
  return {html,after(){
    document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{location.hash="cards."+b.dataset.t});
    const f=$("#flash");if(f){const fl=()=>{FC.flip=!FC.flip;render()};f.onclick=e=>{if(!e.target.closest("a"))fl()};f.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fl()}}}const fb=$("#flipb");if(fb)fb.onclick=()=>{FC.flip=true;render()};
    const grade=ok=>{const box=ok?Math.min(5,(C[c.id]?.box||0)+1):1;store.state.cards[c.id]={box,due:Date.now()+(ok?BOX_DAYS[box]*864e5:0),t:Date.now()};store.save();FC.cur=null;render()};
    const a=$("#again"),g=$("#good");if(a)a.onclick=()=>grade(false);if(g)g.onclick=()=>grade(true);
  }};
}

/* ---------- render loop ---------- */
let rendering=0;
async function render(){
  store.fromHash();$("#glpop").hidden=true;if($("#search").open)$("#search").close();
  const my=++rendering;await glossReady();const r=route();const sub=location.hash.slice(1).split(".").slice(1).join(".");
  buildNav();
  let v;
  if(r==="quiz")v=await viewQuiz(sub);
  else if(r==="q")v=await viewQuiz(null,sub);
  else if(r==="cards")v=await viewCards(sub);
  else if(r==="glossary")v=await viewGlossary();
  else if(r==="resources")v=await viewResources();
  else if(TOPICS.find(t=>t.id===r))v=await viewTopic(r);
  else v=await viewHome();
  if(my!==rendering)return;
  charts.splice(0).forEach(c=>c.destroy());
  if(!(r==="quiz"&&QZ.mock))clearInterval(tick);
  const y=window.scrollY;
  $("#view").innerHTML=typeof v==="string"?v:v.html;$("#view").classList.toggle("wide",!!v.wide);
  if(v.after)v.after();
  if(window.__lastRoute===location.hash)window.scrollTo(0,y);else if(!(TOPICS.find(t=>t.id===r)||r==="glossary")||!location.hash.includes("."))window.scrollTo(0,0);
  window.__lastRoute=location.hash;
  const t=document.querySelector("#view h1");document.title=(t&&r!=="home"?t.textContent+" | ":"")+SITE.title;
  updatePc();
}
async function updatePc(){
  const qs=await allQuiz(),Q=store.state.quiz;
  document.querySelectorAll("[data-pc]").forEach(el=>{const t=el.dataset.pc;const tq=qs.filter(q=>q.topic===t);if(tq.length){el.textContent=`${tq.filter(q=>Q[q.id]).length}/${tq.length}`}});
}
addEventListener("hashchange",render);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",render);
/* ---------- theme: auto (system), light, dark; stored per viewer ---------- */
const THEMES=["auto","light","dark"],TLAB={auto:"Theo hệ thống",light:"Sáng",dark:"Tối"};
const TICON={auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
 light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'};
const curTheme=()=>document.documentElement.dataset.theme||"auto";
function paintTheme(){const t=curTheme();document.querySelectorAll("[data-theme-btn]").forEach(b=>{b.innerHTML=TICON[t]+`<span>${TLAB[t]}</span>`;b.title="Đổi theme: "+TLAB[t];b.setAttribute("aria-label","Theme: "+TLAB[t])})}
document.addEventListener("click",e=>{const b=e.target.closest("[data-theme-btn]");if(!b)return;
  const t=THEMES[(THEMES.indexOf(curTheme())+1)%3];
  if(t==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;
  try{if(t==="auto")localStorage.removeItem("hubTheme");else localStorage.setItem("hubTheme",t)}catch(err){}
  render()});
paintTheme();
store.init();wireSearch();wireGloss();render();
</script>
